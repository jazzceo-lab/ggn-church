name: Build Android AAB

# 로컬 PC에 Java/Android SDK가 없어서, 서명된 AAB를 여기서 빌드해 아티팩트로 받는다.
# 받은 뒤엔 지금처럼 Play Console에 수동 업로드.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Debug secret length (no content exposed)
        run: |
          echo -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | wc -c
          echo -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | tr -d '[:space:]' | wc -c

      - name: Restore keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | tr -d '[:space:]' | base64 -d > android/app/release.keystore

      - name: Restore google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | tr -d '[:space:]' | base64 -d > android/app/google-services.json

      - name: Build signed AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: church-app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

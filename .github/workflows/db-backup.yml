# 주 1회 Supabase DB 백업. 결과 파일은 이 실행의 Artifacts에 90일 보관(매주 1개 → 늘 최근 약 12개).
# 필요한 시크릿: SUPABASE_DB_URL = Supabase 대시보드 > Connect > "Session pooler" 접속 주소
#   (GitHub 서버는 IPv6 직접 연결이 안 돼서 Direct connection 주소는 실패함. 비밀번호를 넣은 전체 주소)
# 복원: pg_restore --no-owner --no-privileges -d "<새 DB 주소>" church-app-db-*.dump
name: DB Backup

on:
  schedule:
    - cron: "0 18 * * 6" # 매주 일요일 03:00 KST
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install pg_dump 17 (Supabase DB 버전과 맞춤)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: Dump database (public + auth)
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DB_URL" ]; then echo "SUPABASE_DB_URL 시크릿이 없습니다"; exit 1; fi
          FILE="church-app-db-$(date -u +%Y%m%d).dump"
          /usr/lib/postgresql/17/bin/pg_dump "$DB_URL" -n public -n auth --no-owner --no-privileges -F c -f "$FILE"
          ls -lh "$FILE"
          echo "FILE=$FILE" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILE }}
          path: ${{ env.FILE }}
          retention-days: 90
